name: festim-view

services:
  backend:
    build:
      dockerfile: Dockerfile.backend
    ports:
      - 8000:8000
    environment:
      - FLASK_PORT=8000
    volumes:
      - backend-data-1:/tmp:rw
  trame:
    build:
      dockerfile: Dockerfile.trame
    ports:
      - 8080:80
    volumes:
      - backend-data-1:/tmp

  frontend:
    build:
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_TRAME_DOMAIN: http://localhost:8080
    ports:
      - 3000:3000
    x-google-cloudrun:
      ingress-container: true
    environment:
      - PRODUCTION=false
      - BACKEND_DOMAIN=http://backend:8000
    depends_on:
      - backend
      - trame
volumes:
  backend-data-1: